<style>
  /* One committed look: a dark viewing room so the photos carry the colour.
     Bronze accent after the main door's hardware (same as the walk-through). */
  :root {
    --ground: #0f1210;
    --glass: rgba(15, 18, 16, 0.62);
    --glass-strong: rgba(15, 18, 16, 0.84);
    --line: rgba(241, 236, 226, 0.16);
    --paper: #f1ece2;
    --muted: #b3ad9f;
    --accent: #d7a24a;
    --accent-ink: #1b1508;
    --plan-room: rgba(241, 236, 226, 0.10);
    --plan-edge: rgba(241, 236, 226, 0.34);
    color-scheme: dark;
    font-family: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--paper); overflow: hidden;
         -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .glass { background: var(--glass); border: 1px solid var(--line);
           backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  /* top: where you are */
  .top { position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
         display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
         padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; }
  .top > * { pointer-events: auto; }
  .where { border-radius: 14px; padding: 10px 14px 11px; min-width: 0; max-width: 62vw; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--muted); }
  #roomName { font-family: "Young Serif", Georgia, "Times New Roman", serif; font-weight: 400;
              font-size: clamp(22px, 4.2vw, 32px); line-height: 1.1; margin: 3px 0 4px;
              text-wrap: balance; }
  #meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* plan card */
  .plan { border-radius: 14px; padding: 8px 10px 10px; width: 244px; }
  .plan-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
               font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
               color: var(--muted); }
  .plan-head button { font: inherit; letter-spacing: 0.08em; color: var(--paper);
                      background: transparent; border: 1px solid var(--line); border-radius: 999px;
                      padding: 3px 9px; cursor: pointer; }
  #plan { display: block; width: 100%; height: auto; margin-top: 6px; }
  #plan .room { fill: var(--plan-room); stroke: var(--plan-edge); stroke-width: 0.06; }
  #plan .plot { fill: none; stroke: var(--plan-edge); stroke-width: 0.08; stroke-dasharray: 0.35 0.25; }
  #plan .dot { fill: var(--paper); stroke: var(--ground); stroke-width: 0.12; cursor: pointer; }
  #plan .dot:hover { fill: var(--accent); }
  #plan .dot.on { fill: var(--accent); }
  #plan .cone { fill: var(--accent); opacity: 0.38; }
  #plan .north { fill: var(--muted); font-size: 0.9px; font-weight: 700; }
  #roofNote { font-size: 12px; color: var(--accent); margin-top: 4px; }

  /* prev / next */
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 46px; height: 46px;
         border-radius: 50%; display: grid; place-items: center; cursor: pointer;
         color: var(--paper); font-size: 20px; line-height: 1; }
  .nav:hover { border-color: var(--accent); color: var(--accent); }
  #prev { left: 16px; } #next { right: 16px; }

  /* filmstrip */
  .strip { position: fixed; left: 0; right: 0; bottom: 0;
           padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
           background: linear-gradient(to top, rgba(15,18,16,0.92), rgba(15,18,16,0.55) 70%, rgba(15,18,16,0)); }
  #hint { font-size: 13px; color: var(--paper); border-radius: 999px; padding: 6px 12px;
          width: max-content; max-width: 100%; margin: 0 auto 10px; }
  .reel { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
          scroll-snap-type: x proximity; }
  .reel::-webkit-scrollbar { display: none; }
  .group { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
                 color: var(--muted); padding-left: 2px; }
  .group-items { display: flex; gap: 8px; }
  .thumb { flex: none; width: 124px; padding: 0; background: transparent; border: 0; cursor: pointer;
           color: var(--paper); text-align: left; scroll-snap-align: start; font: inherit; }
  .thumb img { display: block; width: 124px; height: 62px; object-fit: cover; border-radius: 8px;
               border: 2px solid transparent; background: #1c211d; }
  .thumb span { display: block; font-size: 12px; font-weight: 500; margin-top: 4px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb[aria-current="true"] img { border-color: var(--accent); }
  .thumb[aria-current="true"] span { color: var(--accent); }
  .thumb:focus-visible img, .nav:focus-visible, .plan-head button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent);
         z-index: 5; transition: width 200ms ease; }
  #fail { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
          padding-inline: 24px; color: var(--muted); }

  @media (max-width: 720px) {
    .plan { width: 190px; }
    .plan.folded #plan, .plan.folded #roofNote { display: none; }
    .plan.folded { width: auto; }
    .nav { display: none; }
    .thumb { width: 100px; } .thumb img { width: 100px; height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
</style>

const PHONE = navigator.maxTouchPoints > 0 && matchMedia("(pointer: coarse)").matches;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

// ---------- renderer / sphere ----------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, PHONE ? 1.5 : 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, 1, 0.1, 100);

const geo = new THREE.SphereGeometry(40, 72, 36).scale(-1, 1, 1);

const view = { yaw: 0, pitch: 0, fov: 72, vyaw: 0, vpitch: 0 };
function bearing() {
  const b = Math.atan2(-Math.sin(view.yaw), Math.cos(view.yaw)) * 180 / Math.PI;
  return (b + 360) % 360;

  for (const g of groups) {

    box.className = "group";

      const b = document.createElement("button");
      b.className = "thumb"; b.dataset.i = i;
      b.innerHTML = `<img src="${p.thumb}" alt="" loading="lazy"><span>${p.label}</span>`;

$("next").addEventListener("click", () => show(idx + 1));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
let lastLabel = "", lastT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (keys.has("a")) view.yaw += 1.4 * dt;
  if (keys.has("d")) view.yaw -= 1.4 * dt;
  if (keys.has("w") || keys.has("ArrowUp")) view.pitch = Math.min(1.45, view.pitch + dt);
  if (keys.has("s") || keys.has("ArrowDown")) view.pitch = Math.max(-1.45, view.pitch - dt);
  if (keys.has("+") || keys.has("=")) view.fov = Math.max(35, view.fov - 40 * dt);
  if (keys.has("-")) view.fov = Math.min(95, view.fov + 40 * dt);
  if (!pts.size && (Math.abs(view.vyaw) > 1e-4 || Math.abs(view.vpitch) > 1e-4)) {
    view.yaw += view.vyaw; view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + view.vpitch));
    view.vyaw *= 0.92; view.vpitch *= 0.92;
  }
  if (camera.fov !== view.fov) { camera.fov = view.fov; camera.updateProjectionMatrix(); }
  camera.rotation.set(view.pitch, view.yaw, 0);
  if (fade) {
    const k = fade.dur ? Math.min(1, (now - fade.t0) / fade.dur) : 1;
    back.material.opacity = k;
    if (k >= 1) finishFade();
  }
  const label = DIRS[Math.round(bearing() / 45) % 8];
  if (label !== lastLabel) { lastLabel = label; updateLabels(); }
  updateCone();
  renderer.render(scene, camera);
});

buildReel();
buildPlan();
if (PHONE && innerWidth <= 720) $("planToggle").click();     // folded on phones
let start = 0;
const want = (location.hash || "").slice(1);
let last = null;
try { last = localStorage.getItem("dalaba360.last"); } catch (e) { /* optional */ }
const pick = PANOS.findIndex((p) => p.id === want) >= 0 ? want : last;
if (pick) start = Math.max(0, PANOS.findIndex((p) => p.id === pick));
show(start);
